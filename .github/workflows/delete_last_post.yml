name: Delete Last Instagram Post

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları yükle
        run: pip install playwright requests

      - name: Playwright Chromium kur
        run: playwright install chromium --with-deps

      - name: Son postu sil
        env:
          INSTAGRAM_PLAYWRIGHT_SESSION: ${{ secrets.INSTAGRAM_PLAYWRIGHT_SESSION }}
        run: python delete_last_post.py

      - name: Debug screenshots yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delete-debug-shots
          path: delete_debug*.png
          if-no-files-found: ignore
